<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <!-- Background -->
  <rect width="1400" height="860" fill="#f5f5f5"/>

  <!-- TOP NAV BAR -->
  <rect x="0" y="0" width="1400" height="52" fill="#2c2c2c"/>
  <rect x="14" y="16" width="6" height="6" fill="#fff" opacity="0.8" rx="1"/>
  <rect x="23" y="16" width="6" height="6" fill="#fff" opacity="0.8" rx="1"/>
  <rect x="14" y="25" width="6" height="6" fill="#fff" opacity="0.8" rx="1"/>
  <rect x="23" y="25" width="6" height="6" fill="#fff" opacity="0.8" rx="1"/>
  <text x="42" y="32" font-size="16" fill="#fff" font-weight="600" font-family="Arial,sans-serif">Car Management</text>
  <text x="230" y="33" font-size="14" fill="#fff" opacity="0.85" font-family="Arial,sans-serif">Vehicles</text>
  <text x="300" y="33" font-size="14" fill="#fff" opacity="0.6" font-family="Arial,sans-serif">Services</text>
  <text x="375" y="33" font-size="14" fill="#fff" opacity="0.6" font-family="Arial,sans-serif">Reporting</text>
  <circle cx="1368" cy="26" r="16" fill="#714B67"/>
  <text x="1368" y="31" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">A</text>

  <!-- BREADCRUMB -->
  <rect x="0" y="52" width="1400" height="44" fill="#fff"/>
  <rect x="0" y="95" width="1400" height="1" fill="#dee2e6"/>
  <text x="24" y="80" font-size="14" fill="#714B67" font-family="Arial,sans-serif">All Vehicles</text>
  <text x="114" y="80" font-size="14" fill="#6c757d" font-family="Arial,sans-serif">›</text>
  <text x="126" y="80" font-size="15" fill="#212529" font-weight="600" font-family="Arial,sans-serif">Corolla 2021 [ABC-1234]</text>

  <!-- ACTION BUTTONS -->
  <rect x="992" y="62" width="64" height="28" rx="4" fill="#714B67"/>
  <text x="1024" y="81" font-size="13" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">Save</text>
  <rect x="1064" y="62" width="76" height="28" rx="4" fill="none" stroke="#dee2e6"/>
  <text x="1102" y="81" font-size="13" fill="#495057" text-anchor="middle" font-family="Arial,sans-serif">Discard</text>
  <rect x="1148" y="62" width="90" height="28" rx="4" fill="none" stroke="#dee2e6"/>
  <text x="1193" y="81" font-size="13" fill="#495057" text-anchor="middle" font-family="Arial,sans-serif">⚙ Action</text>
  <rect x="1246" y="62" width="90" height="28" rx="4" fill="none" stroke="#dee2e6"/>
  <text x="1291" y="81" font-size="13" fill="#495057" text-anchor="middle" font-family="Arial,sans-serif">🖨 Print</text>

  <!-- FORM CARD -->
  <rect x="16" y="108" width="980" height="580" rx="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>

  <!-- STATUS BAR -->
  <text x="40" y="148" font-size="13" fill="#6c757d" font-family="Arial,sans-serif">Status:</text>
  <!-- Steps -->
  <rect x="96" y="133" width="90" height="28" rx="14" fill="#d4edda"/>
  <text x="141" y="152" font-size="12" fill="#155724" text-anchor="middle" font-family="Arial,sans-serif">● Available</text>
  <text x="198" y="148" font-size="12" fill="#adb5bd" font-family="Arial,sans-serif">—</text>
  <rect x="212" y="133" width="68" height="28" rx="14" fill="none" stroke="#dee2e6"/>
  <text x="246" y="152" font-size="12" fill="#6c757d" text-anchor="middle" font-family="Arial,sans-serif">In Use</text>
  <text x="292" y="148" font-size="12" fill="#adb5bd" font-family="Arial,sans-serif">—</text>
  <rect x="306" y="133" width="90" height="28" rx="14" fill="none" stroke="#dee2e6"/>
  <text x="351" y="152" font-size="12" fill="#6c757d" text-anchor="middle" font-family="Arial,sans-serif">Maintenance</text>
  <text x="408" y="148" font-size="12" fill="#adb5bd" font-family="Arial,sans-serif">—</text>
  <rect x="422" y="133" width="52" height="28" rx="14" fill="none" stroke="#dee2e6"/>
  <text x="448" y="152" font-size="12" fill="#6c757d" text-anchor="middle" font-family="Arial,sans-serif">Sold</text>

