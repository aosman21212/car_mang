  <!-- FIELD GRID - LEFT -->
  <!-- VIN -->
  <text x="40" y="208" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Vehicle Name</text>
  <text x="40" y="228" font-size="15" fill="#212529" font-weight="600" font-family="Arial,sans-serif">Corolla 2021 [ABC-1234]</text>

  <text x="40" y="265" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Brand</text>
  <text x="40" y="285" font-size="14" fill="#212529" font-family="Arial,sans-serif">Toyota</text>
  <text x="280" y="265" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Model</text>
  <text x="280" y="285" font-size="14" fill="#212529" font-family="Arial,sans-serif">Corolla</text>

  <text x="40" y="320" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">License Plate</text>
  <text x="40" y="340" font-size="14" fill="#212529" font-family="Arial,sans-serif">ABC-1234</text>
  <text x="280" y="320" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">VIN</text>
  <text x="280" y="340" font-size="14" fill="#212529" font-family="Arial,sans-serif">1HGCM82633A004352</text>

  <text x="40" y="375" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Year</text>
  <text x="40" y="395" font-size="14" fill="#212529" font-family="Arial,sans-serif">2021</text>
  <text x="280" y="375" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Color</text>
  <text x="280" y="395" font-size="14" fill="#212529" font-family="Arial,sans-serif">White</text>

  <text x="40" y="430" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Mileage (km)</text>
  <text x="40" y="450" font-size="14" fill="#212529" font-family="Arial,sans-serif">32,500</text>
  <text x="280" y="430" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Owner</text>
  <text x="280" y="450" font-size="14" fill="#714B67" font-family="Arial,sans-serif">Ahmed Al-Rashid</text>

  <text x="40" y="485" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Purchase Date</text>
  <text x="40" y="505" font-size="14" fill="#212529" font-family="Arial,sans-serif">03/15/2021</text>
  <text x="280" y="485" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Notes</text>
  <text x="280" y="505" font-size="14" fill="#6c757d" font-family="Arial,sans-serif">Regular maintenance schedule</text>

  <!-- DIVIDER -->
  <rect x="16" y="530" width="980" height="1" fill="#f0f0f0"/>

  <!-- SMART BUTTONS ROW -->
  <text x="40" y="560" font-size="13" fill="#6c757d" font-weight="600" font-family="Arial,sans-serif">SMART BUTTONS</text>
  <rect x="40" y="572" width="120" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="100" y="598" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">🔧</text>
  <text x="100" y="618" font-size="12" fill="#714B67" text-anchor="middle" font-family="Arial,sans-serif">4 Services</text>
  <rect x="174" y="572" width="120" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="234" y="598" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">💳</text>
  <text x="234" y="618" font-size="12" fill="#714B67" text-anchor="middle" font-family="Arial,sans-serif">2 Invoices</text>
  <rect x="308" y="572" width="120" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="368" y="598" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">📋</text>
  <text x="368" y="618" font-size="12" fill="#714B67" text-anchor="middle" font-family="Arial,sans-serif">History</text>

  <!-- CHATTER PANEL -->
  <rect x="1008" y="108" width="376" height="580" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="1024" y="138" font-size="14" fill="#212529" font-weight="600" font-family="Arial,sans-serif">Log Note</text>
  <text x="1100" y="138" font-size="14" fill="#714B67" font-family="Arial,sans-serif">Send Message</text>
  <text x="1255" y="138" font-size="14" fill="#6c757d" font-family="Arial,sans-serif">Activity</text>
  <rect x="1008" y="148" width="376" height="1" fill="#dee2e6"/>

  <!-- Message input -->
  <rect x="1024" y="160" width="344" height="70" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="1040" y="200" font-size="13" fill="#adb5bd" font-family="Arial,sans-serif">Log an internal note...</text>

  <rect x="1024" y="244" width="60" height="26" rx="4" fill="#714B67"/>
  <text x="1054" y="262" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">Add</text>

  <!-- Messages -->
  <rect x="1008" y="280" width="376" height="1" fill="#f0f0f0"/>
  <text x="1024" y="306" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Today</text>
  <circle cx="1042" cy="332" r="14" fill="#e8d5f0"/>
  <text x="1042" y="337" font-size="10" fill="#714B67" text-anchor="middle" font-family="Arial,sans-serif">A</text>
  <text x="1064" y="326" font-size="13" fill="#212529" font-weight="600" font-family="Arial,sans-serif">Administrator</text>
  <text x="1064" y="344" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Vehicle registered in the system</text>

  <circle cx="1042" cy="378" r="14" fill="#d1ecf1"/>
  <text x="1042" y="383" font-size="10" fill="#0c5460" text-anchor="middle" font-family="Arial,sans-serif">T</text>
  <text x="1064" y="372" font-size="13" fill="#212529" font-weight="600" font-family="Arial,sans-serif">Technician</text>
  <text x="1064" y="390" font-size="12" fill="#6c757d" font-family="Arial,sans-serif">Scheduled 10,000km service</text>

  <!-- LABEL -->
  <rect x="0" y="830" width="320" height="30" fill="#714B67" opacity="0.9"/>
  <text x="12" y="851" font-size="14" fill="#fff" font-weight="600" font-family="Arial,sans-serif">🚗 Vehicle Form — Full Detail View</text>
</svg>
